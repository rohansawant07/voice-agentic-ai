# AWS overlay for compose.yaml: Caddy terminates HTTPS on ROAM_HOST and the
# Basic-auth gateway is no longer published on the host. Paths are relative to
# the repository root (the first Compose file's directory).
services:
  gateway:
    ports: !reset []
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [private]
    ports: ["80:80", "443:443"]
    environment:
      ROAM_HOST: ${ROAM_HOST:?ROAM_HOST is the public hostname}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }
volumes:
  caddy_data:
  caddy_config:
